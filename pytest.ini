[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config --tb=short
markers =
    api: API tests
    ui: UI tests
    ui_contract: UI contract tests (no browser)
    smoke: smoke suite
    e2e: end-to-end suite
    flaky: unstable tests eligible for rerun
filterwarnings =
    ignore::DeprecationWarning
