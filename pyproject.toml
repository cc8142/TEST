[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "reports", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["framework", "tests", "demo_app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "^(venv|reports|\\.pytest_cache)/"
